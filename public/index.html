<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f9fafb" />
		<title>WalletWise Journal</title>

		<link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			href="./favicon/favicon-96x96.png"
			sizes="96x96"
		/>
		<link rel="shortcut icon" href="./favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="./favicon/apple-touch-icon.png"
		/>
		<link rel="manifest" href="./favicon/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="WalletWise" />

		<link
			rel="preload"
			href="./fonts/inter-v20-latin-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="./fonts/inter-v20-latin-regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<style>
			@font-face {
				font-display: swap;
				font-family: "Inter";
				font-style: normal;
				font-weight: 700;
				src: url("./fonts/inter-v20-latin-700.woff2") format("woff2");
			}
			@font-face {
				font-display: swap;
				font-family: "Inter";
				font-style: normal;
				font-weight: 400;
				src: url("./fonts/inter-v20-latin-regular.woff2") format("woff2");
			}
			:root {
				--n50: #f9fafb;
				--n100: #f3f4f6;
				--n200: #e5e7eb;
				--n800: #1f2937;
				--s200: #e2e8f0;
				--s400: #9ca3af;
				--s600: #4b5563;
			}
			html {
				font-family: "Inter", "BIZ UDPGothic", sans-serif !important;
				scroll-behavior: smooth;
				overscroll-behavior-y: none;
				color: var(--n800);
				background-color: var(--n50);
			}
			body {
				margin: 0;
			}
			::-webkit-scrollbar {
				width: 8px;
			}
			::-webkit-scrollbar-track {
				background: var(--n100);
			}
			::-webkit-scrollbar-thumb {
				background: var(--s400);
				border-radius: 4px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: var(--s600);
			}
			.initial-loader {
				position: fixed;
				inset: 0;
				z-index: 50;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background-color: var(--n50);
			}
			.initial-loader-content {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
			}
			.initial-loader-logo {
				width: 4rem;
				height: 4rem;
				animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
			}
			.initial-loader-text {
				display: flex;
				flex-direction: column;
				align-items: center;
				line-height: 1.25;
			}
			.initial-loader-title {
				font-size: 1.25rem;
				font-weight: 700;
				letter-spacing: -0.025em;
				background: linear-gradient(to right, #4f46e5, #7c3aed);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.initial-loader-sub {
				font-size: 10px;
				font-weight: 700;
				color: var(--s400);
				letter-spacing: 0.1em;
				text-transform: uppercase;
				margin-top: 0.125rem;
			}
			.initial-loader-spinner {
				width: 2rem;
				height: 2rem;
				margin-top: 0.5rem;
				border: 3px solid var(--n200);
				border-top-color: #4f46e5;
				border-radius: 9999px;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes pulse {
				50% {
					opacity: 0.6;
				}
			}
		</style>

		<noscript>
			<link
				rel="stylesheet"
				href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
			/>
		</noscript>
	</head>
	<body class="bg-neutral-50 text-neutral-800">
		<noscript>
			<style>
				.noscript-wrapper {
					position: fixed;
					inset: 0;
					display: flex;
					align-items: center;
					justify-content: center;
					background-color: #f9fafb;
					z-index: 9999;
					padding: 1.5rem;
					text-align: center;
					font-family: sans-serif;
				}
				.noscript-icon {
					font-size: 3rem;
					color: #dc2626;
					margin-bottom: 1rem;
				}
				.noscript-title {
					font-size: 1.5rem;
					font-weight: 700;
					color: #1f2937;
					margin-bottom: 0.5rem;
				}
				.noscript-text {
					color: #4b5563;
				}
			</style>
			<div class="noscript-wrapper">
				<div>
					<i class="fas fa-exclamation-triangle noscript-icon"></i>
					<h2 class="noscript-title">JavaScriptが必要です</h2>
					<p class="noscript-text">
						WalletWise
						Journalを利用するには、ブラウザの設定でJavaScriptを有効にしてください。
					</p>
				</div>
			</div>
		</noscript>
		<div id="root">
			<div class="initial-loader">
				<div class="initial-loader-content">
					<img
						src="./favicon/favicon-96x96.png"
						alt="WalletWise Logo"
						class="initial-loader-logo"
						width="64"
						height="64"
					/>
					<div class="initial-loader-text">
						<span class="initial-loader-title">WalletWise</span>
						<span class="initial-loader-sub">Journal</span>
					</div>
					<div class="initial-loader-spinner"></div>
				</div>
			</div>
		</div>
		<script type="module" src="src/index.jsx"></script>
	</body>
</html>
